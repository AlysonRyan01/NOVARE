<mat-card class="card-container">
  <mat-card-header class="card-header">
    <mat-icon  fontIcon="library_add" class="icon"></mat-icon>
    <mat-card-title class="card-title">Criar Produto</mat-card-title>
  </mat-card-header>

  <mat-card-content class="card-content">
    <form class="create-form" (ngSubmit)="createProduct()">
      <mat-form-field appearance="fill">
        <mat-label>Nome do produto</mat-label>
        <input [(ngModel)]="productInput.name" name="name" matInput>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Descrição</mat-label>
        <input matInput [(ngModel)]="productInput.description" name="description">
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Preço</mat-label>
        <input mask="separator.2" prefix="R$ " thousandSeparator="." decimalMarker="," matInput [(ngModel)]="productInput.price" name="price">
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Quantidade</mat-label>
        <input type="number" matInput [(ngModel)]="productInput.stockQuantity" name="stock">
      </mat-form-field>

      <button matButton="filled" color="primary" type="submit">Enviar</button>
    </form>
  </mat-card-content>
</mat-card>
